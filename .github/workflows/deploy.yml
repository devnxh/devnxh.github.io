name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The deploy job publishes with an OIDC token; nothing here needs write access to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces a queued run, but a deployment in progress is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (fails on a missing translation key)
        run: npm run check

      - name: Run the Markdown plugin tests
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build the site and the search index
        run: npm run build

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Without this, /.well-known/security.txt would be left out.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
